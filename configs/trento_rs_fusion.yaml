name: trento_rs_fusion_native_ovseg
seed: 13
output_dir: outputs/trento_rs_fusion

data:
  name: Trento
  source: rs_fusion_datasets
  rs_dataset: trento
  rs_data_home: data/rs_fusion
  rs_train_samples_per_class: 20
  hsi_path: null
  lidar_path: null
  labels_path: null
  train_mask_path: null
  test_mask_path: null
  hsi_key: null
  lidar_key: null
  labels_key: null
  train_mask_key: null
  test_mask_key: null
  class_names: [apple trees, buildings, ground, woods, vineyard, roads]
  seen_class_ids: [1, 2, 3, 4]
  unseen_class_ids: [5, 6]
  pseudo_rgb_indices: [24, 14, 4]

model:
  hsi_encoder: {kind: native, checkpoint: null}
  lidar_encoder: {kind: native, checkpoint: null}
  structure_teacher_encoder: {kind: native, checkpoint: null, frozen: true}
  semantic_teacher_encoder: {kind: native, checkpoint: null, frozen: true}
  clip_checkpoint: null
  clip_model_name: ViT-B-32
  prompt_templates: ["a remote sensing image of {}", "an aerial view of {}"]
  feature_dim: 256
  text_dim: 512
  terrain_window: 9

loss: {structure_teacher_weight: 1.0, semantic_teacher_weight: 1.0, cross_weight: 0.5, gate_weight: 0.01, private_weight: 0.01, temperature: 0.1}
train: {tile_size: 224, overlap: 56, min_seen_pixels: 1, class_aware_sampling: true, class_aware_fraction: 0.7, validation_fraction: 0.1, early_stopping_patience: 20, early_stopping_min_delta: 0.0, cosine_eta_min: 0.000001, batch_size: 2, epochs: 100, learning_rate: 0.0001, backbone_learning_rate: 0.00001, weight_decay: 0.01, gradient_clip: 1.0, amp: true, device: cuda}
